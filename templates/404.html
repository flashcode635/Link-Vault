{% extends 'base.html' %} {% block content %}
<div class="flex-1 flex items-center justify-center p-6 bg-[#fbfbfa]">
  <div class="text-center max-w-md">
    <div
      class="w-14 h-14 rounded-2xl bg-white border border-[#ecece9] flex items-center justify-center mx-auto mb-4 shadow-sm text-[#9b9a97]"
    >
      <svg
        class="w-7 h-7"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>
    <h1 class="text-xl font-bold text-[#37352f] tracking-tight mb-2">
      404 - Resource Not Found
    </h1>
    <p class="text-xs text-[#787774] leading-relaxed mb-6">
      {{ message|default:"The page, shared brain, or API resource you requested
      could not be located in Link Vault." }}
    </p>
    <a
      href="/"
      class="inline-flex items-center gap-1.5 px-4 py-2 bg-[#37352f] text-white hover:bg-black rounded-lg text-xs font-medium transition-colors shadow-xs"
    >
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
      <span>Return to Dashboard</span>
    </a>
  </div>
</div>
{% endblock %}
