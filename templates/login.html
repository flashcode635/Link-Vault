{% extends 'base.html' %}

{% block content %}
<div class="flex-1 flex items-center justify-center p-4 bg-[#fbfbfa]">
  <div class="bg-white border border-[#ecece9] rounded-2xl p-8 max-w-sm w-full shadow-sm">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-[#37352f] text-white flex items-center justify-center mx-auto mb-3 shadow-xs">
        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"></rect>
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 9v1"></path>
          <path d="M12 14v1"></path>
          <path d="M9 12h1"></path>
          <path d="M14 12h1"></path>
        </svg>
      </div>
      <h1 class="text-lg font-bold text-[#18181b] tracking-tight">Sign in to Brain Vault</h1>
      <p class="text-xs text-[#787774] mt-1">Access your private asynchronous knowledge store</p>
    </div>

    <!-- Quick Demo Credential banner -->
    <div class="mb-5 p-3 rounded-xl bg-[#f7f6f3] border border-[#ecece9] text-xs text-[#5a5855] space-y-1.5">
      <div class="flex items-center justify-between font-medium">
        <span>Available Accounts:</span>
        <div class="space-x-2 text-[11px]">
          <button type="button" onclick="fillCurator()" class="text-blue-600 hover:underline">Demo</button>
          <button type="button" onclick="fillRamit()" class="text-emerald-600 hover:underline">Ramit</button>
        </div>
      </div>
      <div class="font-mono text-[11px] text-[#787774] flex justify-between">
        <span>User: <strong class="text-[#37352f]">ramit</strong> / <strong class="text-[#37352f]">pikapika</strong></span>
        <span>|</span>
        <span>User: <strong class="text-[#37352f]">notion_curator</strong> / <strong class="text-[#37352f]">demo123</strong></span>
      </div>
    </div>

    <div id="login-error" class="hidden mb-4 p-2.5 rounded-lg bg-red-50 border border-red-200 text-xs text-red-600"></div>

    <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-[#787774] mb-1">Username</label>
        <input
          type="text"
          id="login-username"
          required
          class="w-full px-3 py-2 text-xs border border-[#e5e5e3] focus:border-[#37352f] rounded-lg outline-none"
        />
      </div>

      <div>
        <label class="block text-xs font-medium text-[#787774] mb-1">Password</label>
        <input
          type="password"
          id="login-password"
          required
          class="w-full px-3 py-2 text-xs border border-[#e5e5e3] focus:border-[#37352f] rounded-lg outline-none"
        />
      </div>

      <button
        type="submit"
        id="login-submit-btn"
        class="w-full py-2 px-4 bg-[#37352f] hover:bg-black text-white text-xs font-medium rounded-lg transition-colors shadow-xs"
      >
        Sign In
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-[#f0f0ef] text-center text-xs text-[#787774]">
      Don't have an account? 
      <a href="/register/" class="text-[#37352f] font-medium hover:underline">Register</a>
    </div>
  </div>
</div>

<script>
  function fillCurator() {
    document.getElementById('login-username').value = 'notion_curator';
    document.getElementById('login-password').value = 'demo123';
    hideError();
  }

  function fillRamit() {
    document.getElementById('login-username').value = 'ramit';
    document.getElementById('login-password').value = 'pikapika';
    hideError();
  }

  function showError(msg) {
    const errBox = document.getElementById('login-error');
    errBox.textContent = msg;
    errBox.classList.remove('hidden');
  }

  function hideError() {
    const errBox = document.getElementById('login-error');
    errBox.classList.add('hidden');
  }

  async function handleLoginSubmit(e) {
    e.preventDefault();
    hideError();
    const btn = document.getElementById('login-submit-btn');
    btn.disabled = true;
    btn.innerText = 'Signing in...';

    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value.trim();

    try {
      const res = await fetch('/api/v1/auth/signin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || 'Authentication failed');
      }

      localStorage.setItem('bv_token', data.token);
      localStorage.setItem('bv_user', JSON.stringify(data.user));
      window.location.href = '/';
    } catch (err) {
      showError(err.message || 'Login failed. Please check your credentials.');
    } finally {
      btn.disabled = false;
      btn.innerText = 'Sign In';
    }
  }
</script>
{% endblock %}
