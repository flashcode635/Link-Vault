{% extends 'base.html' %}

{% block content %}
<div class="flex-1 flex items-center justify-center p-4 bg-[#fbfbfa]">
  <div class="bg-white border border-[#ecece9] rounded-2xl p-8 max-w-sm w-full shadow-sm">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-[#37352f] text-white flex items-center justify-center mx-auto mb-3 shadow-xs">
        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"></rect>
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 9v1"></path>
          <path d="M12 14v1"></path>
          <path d="M9 12h1"></path>
          <path d="M14 12h1"></path>
        </svg>
      </div>
      <h1 class="text-lg font-bold text-[#18181b] tracking-tight">Create an Account</h1>
      <p class="text-xs text-[#787774] mt-1">Start curating your personal Brain Vault</p>
    </div>

    <div id="register-error" class="hidden mb-4 p-2.5 rounded-lg bg-red-50 border border-red-200 text-xs text-red-600"></div>

    <form id="register-form" onsubmit="handleRegisterSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-[#787774] mb-1">Username *</label>
        <input
          type="text"
          id="reg-username"
          required
          placeholder="e.g., alex_dev"
          class="w-full px-3 py-2 text-xs border border-[#e5e5e3] focus:border-[#37352f] rounded-lg outline-none"
        />
      </div>

      <div>
        <label class="block text-xs font-medium text-[#787774] mb-1">Email</label>
        <input
          type="email"
          id="reg-email"
          placeholder="alex@example.com"
          class="w-full px-3 py-2 text-xs border border-[#e5e5e3] focus:border-[#37352f] rounded-lg outline-none"
        />
      </div>

      <div>
        <label class="block text-xs font-medium text-[#787774] mb-1">Password *</label>
        <input
          type="password"
          id="reg-password"
          required
          placeholder="Minimum 6 characters"
          class="w-full px-3 py-2 text-xs border border-[#e5e5e3] focus:border-[#37352f] rounded-lg outline-none"
        />
      </div>

      <button
        type="submit"
        id="reg-submit-btn"
        class="w-full py-2 px-4 bg-[#37352f] hover:bg-black text-white text-xs font-medium rounded-lg transition-colors shadow-xs"
      >
        Create Account
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-[#f0f0ef] text-center text-xs text-[#787774]">
      Already have an account? 
      <a href="/login/" class="text-[#37352f] font-medium hover:underline">Sign In</a>
    </div>
  </div>
</div>

<script>
  function showRegisterError(msg) {
    const errBox = document.getElementById('register-error');
    errBox.textContent = msg;
    errBox.classList.remove('hidden');
  }

  function hideRegisterError() {
    const errBox = document.getElementById('register-error');
    errBox.classList.add('hidden');
  }

  async function handleRegisterSubmit(e) {
    e.preventDefault();
    hideRegisterError();
    const btn = document.getElementById('reg-submit-btn');
    btn.disabled = true;
    btn.innerText = 'Creating account...';

    const username = document.getElementById('reg-username').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value.trim();

    try {
      const res = await fetch('/api/v1/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || 'Registration failed');
      }

      localStorage.setItem('bv_token', data.token);
      localStorage.setItem('bv_user', JSON.stringify(data.user));
      window.location.href = '/';
    } catch (err) {
      showRegisterError(err.message || 'Could not register. Please try again.');
    } finally {
      btn.disabled = false;
      btn.innerText = 'Create Account';
    }
  }
</script>
{% endblock %}
