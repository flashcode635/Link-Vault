<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ title|default:"Brain Vault - Personal Knowledge Base" }}</title>
  <meta name="description" content="A minimalist Notion-style link and note storing application with private folders, tags, search, and sharable brain links.">
  <meta property="og:title" content="Brain Vault - Personal Knowledge Base">
  <meta property="og:description" content="A minimalist Notion-style link and note storing application with private folders, tags, search, and sharable brain links.">

  <!-- Tailwind CSS CDN for pure Django templating -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-[#ffffff] text-[#37352f] antialiased min-h-screen flex flex-col selection:bg-[#ebf5fb] selection:text-[#1e3a8a]">

  <!-- Global Top Bar -->
  <header id="main-header" class="h-14 border-b border-[#ecece9] bg-white sticky top-0 z-30 px-3 sm:px-6 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3 min-w-0">
      <!-- Mobile Drawer Toggle (visible only on small screens) -->
      <button id="mobile-drawer-toggle-btn" onclick="if (window.toggleMobileSidebar) toggleMobileSidebar();" class="md:hidden p-1.5 text-[#787774] hover:text-[#37352f] hover:bg-[#f7f6f3] rounded-md transition-colors" title="Toggle Sidebar">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <a href="/" class="flex items-center gap-2.5 text-inherit no-underline hover:opacity-90 transition-opacity shrink-0">
        <!-- Serif BV Icon in Black Rounded Badge -->
        <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-[#18181b] text-white flex items-center justify-center shadow-xs font-serif font-bold text-sm sm:text-base tracking-tighter select-none">
          BV
        </div>
        <div class="flex items-baseline gap-1.5">
          <span class="font-bold text-sm sm:text-base text-[#18181b] tracking-tight">Brain Vault</span>
          <span class="text-[#d4d4d0] font-light">/</span>
          <span class="text-[10px] sm:text-[11px] font-semibold uppercase tracking-wider text-[#787774]">CURATOR</span>
        </div>
      </a>
    </div>

    <!-- Center Search Bar (Matching Reference Image) -->
    <div class="flex-1 max-w-lg mx-2 hidden sm:block relative">
      <div class="relative flex items-center">
        <svg class="w-3.5 h-3.5 text-[#9b9a97] absolute left-3.5 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          id="dashboard-search-input"
          type="text"
          placeholder="Search titles, URLs, notes, or tags..."
          class="w-full pl-9 pr-14 py-2 text-xs bg-[#fbfbfa] hover:bg-[#f7f6f3] focus:bg-white border border-[#ecece9] focus:border-[#37352f] rounded-full transition-all outline-none text-[#37352f] placeholder:text-[#9b9a97]"
          oninput="handleSearch(this.value)"
        />
        <div class="absolute right-3 flex items-center gap-1">
          <button id="search-clear-btn" onclick="clearSearch()" class="hidden text-[#9b9a97] hover:text-[#37352f] mr-1">
            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
          <kbd class="px-1.5 py-0.5 text-[10px] font-mono text-[#9b9a97] bg-white border border-[#ecece9] rounded shadow-2xs select-none">⌘K</kbd>
        </div>
      </div>
    </div>

    <!-- Right Controls: View Switch, Share, Add, Profile (Matching Reference Image) -->
    <div class="flex items-center gap-2 sm:gap-2.5 shrink-0">
      <!-- Grid / List Switch -->
      <div class="hidden sm:flex items-center border border-[#e5e5e3] rounded-lg p-0.5 bg-[#f7f6f3]">
        <button id="view-grid-btn" onclick="setViewMode('grid')" class="p-1.5 rounded bg-white shadow-2xs text-[#37352f]" title="Grid View">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </button>
        <button id="view-list-btn" onclick="setViewMode('list')" class="p-1.5 rounded text-[#9b9a97] hover:text-[#37352f]" title="List View">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Share Button -->
      <button id="dashboard-share-btn" onclick="openShareModal()" class="px-2.5 sm:px-3 py-1.5 text-xs font-medium text-[#5a5855] hover:text-[#18181b] hover:bg-[#f7f6f3] border border-[#e5e5e3] rounded-lg transition-all flex items-center gap-1.5" title="Share Brain Vault">
        <svg class="w-3.5 h-3.5 text-[#787774]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
        <span class="hidden sm:inline">Share</span>
      </button>

      <!-- + Add Button (Solid Black Button matching reference) -->
      <button id="dashboard-add-btn" onclick="openAddModal()" class="px-3 sm:px-3.5 py-1.5 text-xs font-medium bg-[#18181b] hover:bg-black text-white rounded-lg transition-all flex items-center gap-1.5 shadow-xs" title="Add Knowledge Item">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Add</span>
      </button>

      <!-- User Auth Profile Container (Initials Avatar + Username + Sign Out) -->
      <div id="nav-auth-container" class="flex items-center pl-1 sm:pl-2 border-l border-[#ecece9]">
        <button id="nav-login-btn" onclick="window.location.href='/login/'" class="px-3 py-1.5 text-xs font-medium text-[#37352f] hover:bg-[#f7f6f3] border border-[#e5e5e3] rounded-lg transition-all flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          <span>Sign In</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Page Content -->
  <main class="flex-1 flex flex-col min-h-0">
    {% block content %}
    {% endblock %}
  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Lucide icon initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    });

    // Global Toast Helper
    window.showToast = function(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-3.5 py-2.5 rounded-lg text-xs font-medium shadow-md transition-all transform duration-200 translate-y-2 opacity-0 flex items-center gap-2 ${
        type === 'success' ? 'bg-[#18181b] text-white' :
        type === 'error' ? 'bg-red-600 text-white' :
        'bg-[#37352f] text-white'
      }`;

      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 200);
      }, 3200);
    };
  </script>
  {% block scripts %}
  {% endblock %}
</body>
</html>
